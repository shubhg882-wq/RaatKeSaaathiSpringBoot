<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login | RaatKeSaaathi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
url('/images/login-bg.jpg');

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

}

.login-card{

width:420px;

background:rgba(255,255,255,.10);

backdrop-filter:blur(15px);

border-radius:20px;

padding:40px;

box-shadow:0 0 30px rgba(0,0,0,.4);

color:white;

}

.logo{

font-size:35px;
font-weight:bold;
text-align:center;
color:#ffc107;
margin-bottom:10px;

}

.title{

text-align:center;
margin-bottom:30px;

}

.form-control{

height:50px;

border-radius:10px;

}

.btn-login{

height:50px;

font-size:18px;

font-weight:bold;

border-radius:10px;

}

.bottom-text{

text-align:center;
margin-top:20px;

}

.bottom-text a{

color:#ffc107;
text-decoration:none;
font-weight:bold;

}

.bottom-text a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🍷 RaatKeSaaathi
</div>

<h2 class="title">
Welcome Back
</h2>

<form th:action="@{/login}" method="post">

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-4">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>
<p th:if="${error}" th:text="${error}"
style="color:red;text-align:center;font-weight:bold;"></p>

<button
type="submit"
class="btn btn-warning w-100 btn-login">

Login

</button>

<div class="bottom-text">

Don't have an account?

<a href="/register">

Register Here

</a>

</div>

</form>

</div>

</body>

</html>
</form>

</body>
</html>
