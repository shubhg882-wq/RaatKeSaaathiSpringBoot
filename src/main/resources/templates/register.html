<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register | RaatKeSaaathi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Login wali CSS hi use hogi -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="overlay">

    <div class="login-box">

        <h1>🍷 <span>RaatKeSaaathi</span></h1>

        <h2>Create Account</h2>

        <form th:action="@{/register}" method="post">

            <label>Full Name</label>
            <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter Full Name"
                    required>

            <label class="mt-3">Email Address</label>
            <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter Email"
                    required>

            <label class="mt-3">Password</label>
            <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create Password"
                    required>

            <button type="submit" class="btn btn-warning w-100 mt-4">
                Create Account
            </button>

        </form>

        <p class="text-center mt-4 text-white">

            Already have an account?

            <a th:href="@{/login}"
               style="color:#ffc107;font-weight:bold;text-decoration:none;">
                Login Here
            </a>

        </p>

    </div>

</div>

</body>
</html>
